# P10-AUTHORED minimal workspace file for the InfiniteMatroid verification closure.
# NOT an upstream artifact. Upstream's lean/lakefile.lean (30 requires, config-time git clones and patching) is
# deliberately NOT used: the selected subject's import closure is local modules + Mathlib only (Stage A, A3),
# so the 23 patched third-party packages are irrelevant to it. Source files are byte-identical to the frozen commit.
# Mathlib is pinned to the same rev as upstream's lake-manifest.json; the sibling lake-manifest.json is a SUBSET of
# upstream's manifest (9 entries, byte-for-byte equal JSON; checked by scripts/p10_run.py profile_check()). `lake update` must never be run.
name = "OAI"
version = "0.1.0"
defaultTargets = ["OAI"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "OAI"
roots = ["OAI.Combinatorics.InfiniteMatroid.Main"]
globs = ["OAI.Combinatorics.InfiniteMatroid.+"]

[[lean_lib]]
name = "ComparatorChallenges"
roots = ["ComparatorChallenges.InfiniteMatroid"]
globs = ["ComparatorChallenges.InfiniteMatroid"]
